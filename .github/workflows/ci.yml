name: Poligo CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm build:web

  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --check services/api/src/server.js
      - run: node --check services/api/src/auth.js
      - run: node --check services/api/src/authSchema.js
      - run: node --check services/api/src/adminPolicy.js
      - run: node --check services/api/src/terminalSync.js
      - run: npm install --prefix services/runner
      - run: npm audit --audit-level=moderate --prefix services/runner
      - run: node --test tests/unit/*.test.mjs
      - name: Build and verify production runner image
        run: |
          set -euo pipefail
          docker build -t poligo-runner-ci -f services/runner/Dockerfile .
          docker run -d --name poligo-runner-ci \
            -p 10002:10001 \
            -e PORT=10001 \
            -e RUNNER_TOKEN=runner-ci-token \
            -e TERMINAL_BACKEND=process \
            poligo-runner-ci
          cleanup() {
            docker logs poligo-runner-ci || true
            docker rm -f poligo-runner-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:10002/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' poligo-runner-ci 2>/dev/null || true)" != true ]; then
              docker logs poligo-runner-ci || true
              exit 1
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            docker logs poligo-runner-ci || true
            echo "Production runner image did not become ready" >&2
            exit 1
          fi
          curl --silent --fail http://127.0.0.1:10002/v1/languages \
            -H 'Authorization: Bearer runner-ci-token' |
            node -e 'let data = ""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { const result = JSON.parse(data); if (!Array.isArray(result.languages) || !result.languages.includes("node")) process.exit(1); console.log("PRODUCTION RUNNER IMAGE: PASS", result.languages.join(", ")); })'
      - name: Run Docker terminal end-to-end test
        run: |
          set -euo pipefail
          PORT=10001 RUNNER_TOKEN=terminal-e2e-token node services/runner/src/server.js > /tmp/poligo-terminal-runner-e2e.log 2>&1 &
          runner_pid=$!
          cleanup() {
            kill "$runner_pid" 2>/dev/null || true
            wait "$runner_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:10001/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$runner_pid" 2>/dev/null; then
              cat /tmp/poligo-terminal-runner-e2e.log
              exit 1
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            cat /tmp/poligo-terminal-runner-e2e.log
            echo "Terminal runner did not become ready" >&2
            exit 1
          fi
          node tests/e2e/test_terminal_runner.mjs
      - run: find services/api/src services/runner/src -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - run: python3 -m py_compile tests/e2e/test_terminal_production.py
      - run: python3 -m py_compile tests/e2e/test_admin_controls_production.py
