name: Poligo Hosted Terminal E2E
run-name: Poligo hosted terminal E2E

on:
  push:
    branches:
      - main
    paths:
      - "services/runner/**"
      - "tests/e2e/test_terminal_runner_process.mjs"
      - "render.yaml"
      - ".github/workflows/hosted-terminal-e2e.yml"
      - ".github/workflows/production-terminal-runner-e2e.yml"
  workflow_dispatch:

concurrency:
  group: poligo-hosted-terminal-e2e
  cancel-in-progress: true

jobs:
  hosted-terminal-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install test dependency
        run: npm install --no-save ws@8.22.0

      - name: Build runner image
        run: docker build -t poligo-hosted-terminal-e2e -f services/runner/Dockerfile .

      - name: Start hosted terminal runner
        run: |
          docker run -d --name poligo-hosted-terminal-e2e -p 10001:10001 -e RUNNER_TOKEN=terminal-process-e2e-token -e TERMINAL_BACKEND=process -e TERMINAL_RUN_ROOT=/tmp/poligo-terminal-sessions -e TERMINAL_IDLE_TTL_MS=60000 -e TERMINAL_MAX_LIFETIME_MS=300000 poligo-hosted-terminal-e2e

      - name: Wait for runner
        run: |
          set -e
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:10001/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs poligo-hosted-terminal-e2e
          exit 1

      - name: Run hosted terminal E2E
        run: node tests/e2e/test_terminal_runner_process.mjs

      - name: Runner logs
        if: always()
        run: docker logs poligo-hosted-terminal-e2e

      - name: Stop hosted terminal runner
        if: always()
        run: docker rm -f poligo-hosted-terminal-e2e
