name: Poligo Production Admin Storage E2E

on:
  workflow_dispatch:

jobs:
  production-admin-storage-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.63.0

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Wait for production services
        env:
          POLIGO_WEB_URL: https://poligo-web-2n2l.onrender.com
          POLIGO_API_URL: https://poligo-api-g0wc.onrender.com
        run: |
          set -e
          for attempt in $(seq 1 60); do
            if curl -fsS "$POLIGO_API_URL/api/health" >/tmp/poligo-api-health.json &&
              curl -fsS "$POLIGO_WEB_URL/" >/tmp/poligo-web-health.html; then
              cat /tmp/poligo-api-health.json
              echo "Production services are reachable."
              exit 0
            fi
            sleep 2
          done
          echo "Production services did not become reachable in time." >&2
          exit 1

      - name: Run production admin storage E2E
        env:
          POLIGO_WEB_URL: https://poligo-web-2n2l.onrender.com
          POLIGO_ADMIN_EMAIL: ${{ secrets.POLIGO_ADMIN_EMAIL }}
          POLIGO_ADMIN_PASSWORD: ${{ secrets.POLIGO_ADMIN_PASSWORD }}
          POLIGO_TARGET_USER_EMAIL: ${{ secrets.POLIGO_TARGET_USER_EMAIL }}
          POLIGO_TARGET_USER_PASSWORD: ${{ secrets.POLIGO_TARGET_USER_PASSWORD }}
        run: python tests/e2e/test_admin_storage_limit.py
