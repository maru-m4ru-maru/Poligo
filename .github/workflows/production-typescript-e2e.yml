name: Poligo Production TypeScript E2E
run-name: Poligo TypeScript production E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: poligo-typescript-production-e2e
  cancel-in-progress: true

jobs:
  production-typescript-e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[typescript-e2e-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.63.0

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Wait for production services
        env:
          POLIGO_WEB_URL: https://poligo-web-2n2l.onrender.com
          POLIGO_API_URL: https://poligo-api-g0wc.onrender.com
          EXPECTED_API_COMMIT: ${{ github.sha }}
        run: |
          set -e
          for attempt in $(seq 1 300); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$POLIGO_API_URL/api/health" >/tmp/poligo-api-health.json &&
              curl -fsS --connect-timeout 5 --max-time 10 "$POLIGO_WEB_URL/" >/tmp/poligo-web-health.html; then
              cat /tmp/poligo-api-health.json

              if python - "$EXPECTED_API_COMMIT" <<'PY'
          import json
          import sys

          with open("/tmp/poligo-api-health.json", encoding="utf-8") as handle:
              data = json.load(handle)

          database = data.get("database") or {}
          expected = sys.argv[1]

          raise SystemExit(
              0
              if data.get("status") == "ok" and
              data.get("service") == "api" and
              data.get("executor") == "judge0" and
              database.get("status") == "online" and
              data.get("commit") == expected
              else 1
          )
          PY
              then
                echo "Production services are healthy at $EXPECTED_API_COMMIT."
                exit 0
              fi
            fi

            sleep 2
          done

          echo "Production services did not become healthy at $EXPECTED_API_COMMIT." >&2
          cat /tmp/poligo-api-health.json 2>/dev/null || true
          exit 1

      - name: Validate TypeScript environment source
        run: |
          node <<'NODE'
          const fs = await import('node:fs/promises')
          const source = await fs.readFile('services/api/src/server.js', 'utf8')
          const required = [
            "'(globalThis as any).process = (globalThis as any).process || {};',",
            "'(globalThis as any).process.env = (globalThis as any).process.env || {};',",
            "    ');',"
          ]
          for (const value of required) {
            if (!source.includes(value)) {
              throw new Error('TypeScript environment source regression detected')
            }
          }
          NODE
      - name: Run production TypeScript E2E
        env:
          POLIGO_WEB_URL: https://poligo-web-2n2l.onrender.com
        run: python -u tests/e2e/test_typescript_production.py

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: poligo-typescript-production-e2e-failure
          path: poligo-typescript-production-e2e-failure.png
          if-no-files-found: ignore
