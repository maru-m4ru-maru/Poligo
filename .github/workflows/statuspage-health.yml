name: Statuspage health sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check API and update Statuspage
        env:
          STATUSPAGE_API_KEY: ${{ secrets.STATUSPAGE_API_KEY }}
        run: |
          set -euo pipefail

          page_id="lkxb9gdgh39h"
          component_id="5hln0gsyxhyn"
          health_url="https://poligo-api-g0wc.onrender.com/api/health"
          statuspage_url="https://api.statuspage.io/v1/pages/${page_id}/components/${component_id}"

          status="major_outage"

          if curl --fail --silent --show-error --max-time 20 "${health_url}" > /dev/null; then
            status="operational"
          fi

          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: OAuth ${STATUSPAGE_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"component\":{\"status\":\"${status}\"}}" \
            "${statuspage_url}"
