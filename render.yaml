services:
  - type: web
    name: poligo-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile=false && pnpm build:web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://poligo-api-g0wc.onrender.com

  - type: web
    name: poligo-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile=false
    startCommand: pnpm --dir services/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TURSO_DATABASE_URL
        value: libsql://poligo-maru-m4ru-maru.aws-ap-northeast-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: RUNNER_URL
        sync: false
      - key: RUNNER_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: https://poligo-web-2n2l.onrender.com
      - key: BETTER_AUTH_URL
        value: https://poligo-api-g0wc.onrender.com
      - key: BETTER_AUTH_SECRET
        sync: false
