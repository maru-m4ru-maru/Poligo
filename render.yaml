services:
  - type: web
    name: poligo-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile=false && pnpm build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://poligo-api-g0wc.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://poligo-web-2n2l.onrender.com
      - key: VITE_TERMINAL_WS_URL
        value: https://poligo-api-g0wc.onrender.com

  - type: web
    name: poligo-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile=false
    startCommand: pnpm --dir services/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TURSO_DATABASE_URL
        value: libsql://poligo-maru-m4ru-maru.aws-ap-northeast-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: POLIGO_ENCRYPTION_KEY
        sync: false
      - key: RUNNER_URL
        value: https://poligo-terminal-runner.onrender.com
      - key: RUNNER_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: https://poligo-web-2n2l.onrender.com
      - key: POLIGO_ADMIN_USER_IDS
        sync: false
      - key: POLIGO_ADMIN_EMAILS
        sync: false
      - key: BETTER_AUTH_URL
        value: https://poligo-api-g0wc.onrender.com
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        value: https://poligo-web-2n2l.onrender.com
      - key: OPENROUTER_MODEL_FAST
        value: qwen/qwen-2.5-coder-7b-instruct:free
      - key: OPENROUTER_MODEL_CODE
        value: qwen/qwen-2.5-coder-32b-instruct:free
      - key: OPENROUTER_MODEL_REASONING
        value: deepseek/deepseek-r1-distill-qwen-32b:free
