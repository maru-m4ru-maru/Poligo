services:
  - type: web
    name: poligo-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile=false && pnpm build:web
    staticPublishPath: ./apps/web/dist

  - type: web
    name: poligo-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile=false
    startCommand: pnpm --dir services/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: RUNNER_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
